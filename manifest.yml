modules:
  macro:
    - key: hello-world-app-hello-world-macro
      resource: main
      render: native
      resolver:
        function: resolver
      title: Forge app for san
  function:
    - key: resolver
      handler: resolvers/index.handler

resources:
  - key: main
    path: src/frontend/index.jsx
app:
  runtime:
    name: nodejs22.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/99e930e0-9ace-4e0e-a051-07e62859be5c

permissions:
  scopes:
    - storage:app
    - read:comment:confluence
    - read:confluence-user
